name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Systemabhaengigkeiten fuer Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Locale-Keys pruefen
        run: |
          node scripts/check-locales.mjs
          node scripts/check-used-locales.mjs

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Frontend-Tests
        run: bun run test

      - name: Frontend-Build (liefert dist/ fuer generate_context!)
        env:
          VITE_OPENROUTER_API_KEY: l8git-build-secret-sentinel-2026
        run: bun run build

      - name: Bundle security and performance budgets
        run: |
          node scripts/check-build.mjs
          bun scripts/benchmark-ui.ts

      - name: Rust-Tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets --features headless

      - name: Mobile typecheck and tests
        working-directory: mobile
        run: |
          bun run typecheck
          bun run test

      - name: Relay tests
        working-directory: relay
        run: cargo test --locked

      - name: Browser installation
        run: bunx playwright install --with-deps chromium

      - name: Browser workflows
        run: bun run test:ui

      - name: Renderer startup and memory budgets
        run: |
          bunx vite build --config vite.ui-test.config.ts
          node scripts/benchmark-runtime.mjs

      - name: Preserve renderer measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-performance
          path: test-results/runtime-budgets.json
          if-no-files-found: ignore

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/

  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung Git subprocess otherwise blocks the job for the 6h default and hides its log.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Test native Git workflows with release features
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets --features headless
