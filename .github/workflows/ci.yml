name: CI

on:
  pull_request:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Systemabhaengigkeiten fuer Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Locale-Keys pruefen
        run: node scripts/check-locales.mjs

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Frontend-Tests
        run: bun run test

      - name: Frontend-Build (liefert dist/ fuer generate_context!)
        run: bun run build

      - name: Rust-Tests
        working-directory: src-tauri
        run: cargo test --all-targets
