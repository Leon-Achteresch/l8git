ShortDescription: A fast, multi-repository Git desktop client built with Tauri 2, React 19 and Rust.
Description: |-
  l8git is a desktop Git client that manages multiple repositories simultaneously in a single,
  tabbed workspace. It covers status, staging, commits, branches, merges, cherry-picks, stashes,
  tags, remotes, submodules, worktrees, hooks and bisect, plus pull request and CI integration
  for GitHub, GitHub Enterprise and Bitbucket, an embedded terminal, blame, diffs with syntax
  highlighting and AI-generated commit messages.
  Requires git to be installed and available in PATH.
