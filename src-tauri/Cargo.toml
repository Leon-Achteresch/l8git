[package]
name = "l8git"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "l8git"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "l8git_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "l8gitd"
path = "src/bin/l8gitd.rs"
required-features = ["headless"]

[features]
default = []
headless = [
	"dep:axum",
	"dep:x25519-dalek",
	"dep:chacha20poly1305",
	"dep:hkdf",
	"dep:hmac",
	"dep:sha2",
	"dep:subtle",
	"dep:rand",
	"dep:qrcode",
	"dep:clap",
	"dep:futures-util",
	"dep:tokio-tungstenite",
	"tokio/full",
	"keyring/apple-native",
	"keyring/linux-native",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
notify = "6"
notify-debouncer-full = "0.3"
tauri-plugin-process = "2"
portable-pty = "0.9"
once_cell = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
dirs = "6"
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls", "gzip"] }

axum = { version = "0.8", features = ["ws"], optional = true }
x25519-dalek = { version = "2", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
rand = { version = "0.8", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
tokio-tungstenite = { version = "0.29", features = ["native-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSColor", "NSControl", "NSDockTile", "NSImage", "NSLayoutAnchor", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "block2"] }
raw-window-handle = "0.6"
